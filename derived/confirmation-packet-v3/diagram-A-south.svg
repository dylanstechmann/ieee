<text x="45" y="805" >Legend: blue solid = arrival; orange dashed = withdrawal (often overlaps arrival); grey = retained race/re-entry.</text>
<text x="45" y="829" >Green polygons = selected 10×10-in chassis footprints; short green lines = body heading, not travel direction.</text>
<text x="45" y="853" >S = start; M = retained mouth pose; D = unchanged dock; R = final race staging. Spins/reverse travel occur.</text>
<text x="45" y="877" >Dashed grey track outline is a low-resolution trace, NOT an official legal boundary. No finish-line location inferred.</text>
<text x="45" y="901" >No tire/mechanism extension or official vehicle envelope shown; those must be specified before qualification.</text>
<text x="45" y="925" >Source geometry: archived GM2 V3 drawing + constrained-field-v3.json; wall scenario inside-nominal.</text>
<text x="45" y="949" >Both illustrations deliberately use the empty control: no claim that a square pit blocker is an official placement.</text>
<text x="45" y="973" >Agent-prepared clarification illustration — no organizer answer received or external message sent.</text>
